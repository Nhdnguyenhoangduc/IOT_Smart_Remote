[env:esp32c3_supermini]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino

; --- Flash 4MB, 2 slot OTA (co spiffs/littlefs ho tro luu file) ---
board_upload.flash_size = 4MB
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
board_build.flash_mode = dio

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    ; =========================================================================
    ;  THÔNG TIN PHIÊN BẢN & HIỆU ỨNG LED RGB ĐỂ TEST FOTA
    ; =========================================================================
    -DFW_VERSION=\"1.0.1\"

    ; --- CHỌN HIỆU ỨNG CHO DEMO_PATTERN (0..4) ---
    ; 0 = Nháy màu theo patch version (1.0.0=Đỏ, 1.0.1=Xanh lá, 1.0.2=Xanh lam, 1.0.3=Vàng, 1.0.4=Cyan, 1.0.5=Magenta, 1.0.6=Trắng, 1.0.7=Cam)
    ; 1 = Chuyển màu cầu vồng (Rainbow xoay vòng liên tục mượt mà)
    ; 2 = Strobe trắng (Chớp nháy trắng nhanh kiểu đèn Flash)
    ; 3 =   ật thị giác Fechner, sử dụng màu DEMO_R/G/B bên dưới)
    ; 4 = Nháy 3 màu xen kẽ tuần tự: Đỏ -> Xanh lá -> Xanh lam (mỗi màu 0.5s)
    -DDEMO_PATTERN=1

    ; --- TÙY CHỌN MÀU SẮC (Dùng riêng cho Pattern 3: Breathing) ---
    ; DEMO_R, DEMO_G, DEMO_B: giá trị từ 0 đến 255
    ; Mẫu một số màu đẹp:
    ;   - Xanh ngọc Cyan : R=0,   G=150, B=255
    ;   - Vàng ấm Amber  : R=255, G=120, B=0
    ;   - Tím Purple     : R=180, G=0,   B=255
    ;   - Xanh lá Lime   : R=50,  G=255, B=50
    -DDEMO_R=0
    -DDEMO_G=150
    -DDEMO_B=255

; --- Serial Monitor ---
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 1
monitor_filters = esp32_exception_decoder

; --- Upload ---
upload_protocol = esptool
upload_speed = 460800

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7
    crankyoldgit/IRremoteESP8266@^2.8.6
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
